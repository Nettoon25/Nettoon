<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes" />

  <link rel="icon" href="icons/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Nettoon.com</title>

  <link rel="stylesheet" href="style18.css" />

</head>

<body>

<main>
<!-- =========================================================
     NETTOON SEARCHED PROFILE
========================================================= -->

<section class="searched-profile">

    <!-- =========================
         LEFT: PROFILE IMAGE
    ========================== -->

    <div class="searched-profile-image">

        <img
            src="14.png"
            alt="Guest profile"
        >

    </div>


    <!-- =========================
         RIGHT: PROFILE CONTENT
    ========================== -->

    <div class="searched-profile-content">

        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-name-section">

                <h2>Guest</h2>

                <span class="profile-username">
                    @guest
                </span>

            </div>

            <button
                class="profile-options"
                type="button"
                aria-label="Profile options"
            >
                ⋮
            </button>

        </div>


        <!-- PROFILE DESCRIPTION -->

        <div class="profile-description">

            <p>
                Nettoon creator and animation enthusiast.
                Welcome to my profile.
            </p>

        </div>


        <!-- =================================
             CONTENT TOGGLE TABS
        ================================== -->

        <div
            class="profile-content-tabs"
            role="tablist"
            aria-label="Profile content"
        >

            <button
                class="profile-tab active"
                type="button"
                data-content="videos"
                role="tab"
                aria-selected="true"
            >
                Videos
            </button>

            <button
                class="profile-tab"
                type="button"
                data-content="series"
                role="tab"
                aria-selected="false"
            >
                Series
            </button>

            <button
                class="profile-tab"
                type="button"
                data-content="shorts"
                role="tab"
                aria-selected="false"
            >
                Shorts
            </button>

        </div>


        <!-- =================================
             ONE-TIME VIDEOS
        ================================== -->

        <div
            class="profile-content-panel active"
            id="videos"
            role="tabpanel"
        >

            <div class="profile-video-grid">

                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="Love death & robots.jpg"
                            alt="Video thumbnail"
                        >

                    </div>

                    <h3>
                        LOVE DEATH + ROBOTS VOLUME 4
                    </h3>

                    <span>
                        0 views
                    </span>

                </a>


                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="ADAM.png"
                            alt="Video thumbnail"
                        >

                    </div>

                    <h3>
                        ADAM
                    </h3>

                    <span>
                        0 views
                    </span>

                </a>


                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="Zygote.jpg"
                            alt="Video thumbnail"
                        >

                    </div>

                    <h3>
                        Zygote
                    </h3>

                    <span>
                        0 views
                    </span>

                </a>

            </div>

        </div>


        <!-- =================================
             SERIES
        ================================== -->

        <div
            class="profile-content-panel"
            id="series"
            role="tabpanel"
        >

            <div class="profile-video-grid">

                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="Rakka_poster.jpg"
                            alt="Series thumbnail"
                        >

                        <span class="episode-badge">
                            10 Ep
                        </span>

                        <span class="season-badge">
                            Sn 1
                        </span>

                    </div>

                    <h3>
                        Rakka
                    </h3>

                </a>


                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="firebase.webp"
                            alt="Series thumbnail"
                        >

                        <span class="episode-badge">
                            15 Ep
                        </span>

                        <span class="season-badge">
                            Sn 2
                        </span>

                    </div>

                    <h3>
                        Fire Base
                    </h3>

                </a>


                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail">

                        <img
                            src="God Serengeti  Chicago.jpg"
                            alt="Series thumbnail"
                        >

                        <span class="episode-badge">
                            5 Ep
                        </span>

                        <span class="season-badge">
                            Sn 4
                        </span>

                    </div>

                    <h3>
                        God Serengeti
                    </h3>

                </a>

            </div>

        </div>


        <!-- =================================
             SHORTS
        ================================== -->

        <div
            class="profile-content-panel"
            id="shorts"
            role="tabpanel"
        >

            <div class="profile-video-grid shorts-grid">

                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail short-thumbnail">

                        <img
                            src="ADAM.png"
                            alt="Short video thumbnail"
                        >

                    </div>

                    <h3>
                        Animation Short
                    </h3>

                </a>


                <a href="index3.html" class="profile-video-card">

                    <div class="profile-thumbnail short-thumbnail">

                        <img
                            src="Zygote.jpg"
                            alt="Short video thumbnail"
                        >

                    </div>

                    <h3>
                        Short Film
                    </h3>

                </a>

            </div>

        </div>

    </div>

</section>

 <script src="script18.js"></script>

           </main>
          </body>
          </html>
