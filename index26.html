<html lang="en">

<header>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
  minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes">

  <link rel="icon" href="icons/logo.png" type="image/x-icon">

<title>
Nettoon.com
</title>

<link rel="stylesheet" href="style26.css">
<link rel=“stylesheet” type=”text/css” href=“https://seobli.com/wl/structure.css”>
 
</header>

<body>

<main>

<div class="nettoon-payment-card">

  <div class="payment-header">
    <h2>Complete Your Payment</h2>
    <p>Choose your preferred payment method.</p>
  </div>

  <!-- Selected plan -->
  <div class="selected-plan">
    <div>
      <span class="small-label">Selected Plan</span>
      <strong id="selectedPlanName">Nettoon Standard</strong>
    </div>

    <div class="selected-price">
      <span id="selectedPlanPrice">KES 300</span>
      <small>/ month</small>
    </div>
  </div>


  <!-- Customer details -->
  <div class="payment-section">

    <label for="customerName">Full Name</label>
    <input
      type="text"
      id="customerName"
      placeholder="Enter your full name"
      autocomplete="name"
    >

    <label for="customerEmail">Email Address</label>
    <input
      type="email"
      id="customerEmail"
      placeholder="you@example.com"
      autocomplete="email"
    >

  </div>


  <!-- Payment methods -->
  <div class="payment-section">

    <h3>Payment Method</h3>

    <div class="payment-methods">

      <!-- M-PESA -->
      <button
        type="button"
        class="payment-method mpesa-method"
        id="mpesaButton"
      >

        <div class="payment-icon mpesa-icon">
          M
        </div>

        <div class="payment-method-text">
          <strong>M-PESA</strong>
          <span>Pay securely with M-PESA</span>
        </div>

        <div class="payment-arrow">
          →
        </div>

      </button>


      <!-- PAYSTACK -->
      <button
        type="button"
        class="payment-method card-method"
        id="cardButton"
      >

        <div class="payment-icon card-icon">
          💳
        </div>

        <div class="payment-method-text">
          <strong>Card / Paystack</strong>
          <span>Visa, Mastercard & supported cards</span>
        </div>

        <div class="payment-arrow">
          →
        </div>

      </button>

    </div>

  </div>


  <!-- Security message -->

  <div class="secure-payment">

    <span>🔒</span>

    <div>
      <strong>Secure payment</strong>
      <p>
        Your payment information is securely processed
        by our payment partners.
      </p>
    </div>

  </div>


  <!-- Total -->

  <div class="payment-total">

    <span>Total</span>

    <strong id="paymentTotal">
      KES 300
    </strong>

  </div>


  <!-- Status -->

  <div
    id="paymentStatus"
    class="payment-status"
    style="display:none;"
  ></div>

</div>


<!-- Paystack V2 -->
<script src="script26.js"></script>
